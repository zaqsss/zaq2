<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brechosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">BRECHOSK</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link active" href="#camisas">Camisas</a>
          <a class="nav-link" href="#calcas">Calças</a>
          <a class="nav-link" href="#moletom">Moletom</a>
        </div>
      </div>
    </nav>

    <div id="camisas" class="container mt-5">
      <h2 class="text-center">Camisas</h2>
      <div id="carouselCamisas" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselCamisas" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselCamisas" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselCamisas" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://46575.cdn.simplo7.net/static/46575/sku/roupas-camisetas-masculinas-camiseta-streetwear-masculina-five-oh-fv2023001-p-1697294828275.jpg" class="d-block w-100" alt="Camisa 1">
          </div>
          <div class="carousel-item">
            <img src="https://cdn.awsli.com.br/2500x2500/147/147820/produto/254612242/camisa-modelo-2004-8w9hml5dw4.jpg" class="d-block w-100" alt="Camisa 2">
          </div>
          <div class="carousel-item">
            <img src="https://img.ltwebstatic.com/images3_spmp/2024/05/06/a4/1715002477e7752beee15d66dbf3309b079a0ec20f_thumbnail_405x552.png" class="d-block w-100" alt="Camisa 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselCamisas" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselCamisas" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <div id="calcas" class="container mt-5">
      <h2 class="text-center">Calças</h2>
      <div id="carouselCalcas" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselCalcas" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselCalcas" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselCalcas" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://cdn.sistemawbuy.com.br/arquivos/50bd189a62ea0171409a01931f5b5931/produtos/65775e39ec6c7/4004-5-65775f4ab2f00.jpeg" class="d-block w-100" alt="Calça 1">
          </div>
          <div class="carousel-item">
            <img src="https://a-static.mlcdn.com.br/800x560/calca-cargo-masculina-5-bolsos-skate-streetwear-larga-prata-caqui-bege-preta-skatista-volgue/volguemodas/b341458e4bfb11eeae524201ac185056/08c42712e0745bd7cdf90175a214d25d.jpeg" class="d-block w-100" alt="Calça 2">
          </div>
          <div class="carousel-item">
            <img src="https://acdn.mitiendanube.com/stores/087/236/products/calcacargocb61-7156c6d8947582f11a16673120273918-640-0.jpg" class="d-block w-100" alt="Calça 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselCalcas" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselCalcas" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <div id="moletom" class="container mt-5">
      <h2 class="text-center">Moletom</h2>
      <div id="carouselMoletom" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carouselMoletom" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carouselMoletom" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carouselMoletom" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="https://acdn.mitiendanube.com/stores/001/790/777/products/6-e5be49ad420b90704517189985236558-1024-1024.png" class="d-block w-100" alt="Moletom 1">
          </div>
          <div class="carousel-item">
            <img src="https://images.tcdn.com.br/img/img_prod/1046263/moletom_essentials_grafite_5911_1_91b6a85acc0868c382da4b2bd0292273.jpg" class="d-block w-100" alt="Moletom 2">
          </div>
          <div class="carousel-item">
            <img src="https://images.tcdn.com.br/img/img_prod/1029517/casaco_moletom_hybe_classic_marrom_795_1_08abe5745999fd547beb7f2df3d27656.jpg" class="d-block w-100" alt="Moletom 3">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselMoletom" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselMoletom" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz4fnFO9gybQv9kY4fUWW1x6ewfhIjJe2URndF1K6b7dxnQq5X2GZZ8DkP7" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-pzjw8f+ua7Kw1TIq0rI3ddJz6sP9s1TS3bDFizZ3w4cL6+q9osTjOq2dZKlmDqCp" crossorigin="anonymous"></script>
  </body>
</html>
